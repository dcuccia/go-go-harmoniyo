name: Deploy S9 signalling Worker

on:
  workflow_dispatch:
    inputs:
      enable_demo:
        description: Explicitly enable public browser TURN fallback
        type: boolean
        default: false
      demo_until:
        description: UTC cutoff (YYYY-MM-DDTHH:MM:SSZ, up to 12 hours ahead)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: s9-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: s9-worker
    defaults:
      run:
        working-directory: spikes/s9-page-host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate locally
        run: npm run deploy:worker
      - name: Deploy and verify the public Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S9_SIGNAL_ORIGIN: ${{ vars.S9_SIGNAL_ORIGIN }}
          S9_ENABLE_DEMO: ${{ inputs.enable_demo }}
          S9_DEMO_UNTIL: ${{ inputs.demo_until }}
        shell: bash
        run: |
          if [[ "$S9_ENABLE_DEMO" == "true" ]]; then
            npm run deploy:worker -- --deploy "--demo-until=$S9_DEMO_UNTIL"
          elif [[ -n "$S9_DEMO_UNTIL" ]]; then
            echo 'Refusing demo cutoff without explicit enablement.' >&2
            exit 1
          else
            npm run deploy:worker -- --deploy
          fi
