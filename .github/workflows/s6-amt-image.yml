name: s6-amt-image

# Builds the S6 Anticipatory Music Transformer (AMT) accompaniment container and publishes it to
# GHCR. The pushed digest goes into spikes/s6-ai-arranging/amt/manifest.json, which the owner
# sends to cuccia-infra. Publishing is a deliberate owner act, so this runs only on demand
# (never on pull requests). See spikes/s6-ai-arranging/amt/README.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Human-readable image tag (consumers pin the digest, not the tag)
        required: true
        default: 0.1.0-cu124-medium

permissions:
  contents: read
  packages: write

concurrency:
  group: s6-amt-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dcuccia/go-go-harmoniyo-amt
  CONTEXT: spikes/s6-ai-arranging/amt

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag
        id: tag
        env:
          TAG: ${{ inputs.tag || '0.1.0-cu124-medium' }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::invalid tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The GPU image is about 8 GB (CUDA torch wheels + 1.4 GB of baked-in weights); the runner's
      # preinstalled toolchains are not needed and leave too little disk for BuildKit otherwise.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune -af > /dev/null
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: the layers are bigger than the 10 GB GitHub Actions cache, and the build
      # runs rarely. Provenance and SBOM are BuildKit attestations attached to the pushed index.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}/${{ env.CONTEXT }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.licenses=MIT AND Apache-2.0
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.licenses=MIT AND Apache-2.0
            index:org.opencontainers.image.description=Anticipatory Music Transformer accompaniment (Go Go HarmoniYo spike S6)

      # Pull the published digest and check it under the AI node's sandbox flags: imports work
      # without network on a read-only root filesystem as a non-root user, and the baked-in
      # weights still match the SHA-256 pinned in the Dockerfile.
      - name: Verify the published image
        id: verify
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx prune --all --force > /dev/null
          docker pull --quiet "$REF"
          docker run --rm --network none --read-only --tmpfs /tmp:size=2g --cap-drop ALL \
            --security-opt no-new-privileges --memory 8g --cpus 4 --pids-limit 512 \
            --entrypoint python "$REF" -c '
          import hashlib, json, os, sys
          import torch, transformers, mido, anticipation
          d = os.environ["AMT_MODEL_DIR"]
          h = hashlib.sha256()
          with open(os.path.join(d, "pytorch_model.bin"), "rb") as f:
              for b in iter(lambda: f.read(1 << 24), b""):
                  h.update(b)
          print(json.dumps({"uid": os.getuid(), "python": sys.version.split()[0], "torch": torch.__version__,
                            "torch_cuda": torch.version.cuda, "transformers": transformers.__version__,
                            "model_dir": d, "model_sha256": h.hexdigest(),
                            "model_bytes": os.path.getsize(os.path.join(d, "pytorch_model.bin"))}))
          ' | tee verify.json
          expected=$(sed -n 's/^ARG MODEL_SHA256=//p' "$CONTEXT/Dockerfile")
          actual=$(jq -r .model_sha256 verify.json)
          [ "$actual" = "$expected" ] || { echo "::error::model sha256 $actual != $expected"; exit 1; }
          [ "$(jq -r .uid verify.json)" != 0 ] || { echo "::error::image runs as root"; exit 1; }
          docker image inspect "$REF" --format '{{.Size}}' > size.txt

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p out
          echo "$IMAGE@$DIGEST" > out/digest.txt
          platform=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          compressed=$(docker buildx imagetools inspect "$IMAGE@$platform" --raw | jq '[.layers[].size] | add')
          jq -n --arg image "$IMAGE@$DIGEST" --arg digest "$DIGEST" --arg platform "$platform" \
            --arg tag "$TAG" --arg revision "$GITHUB_SHA" --arg run "$RUN_URL" \
            --argjson compressed "$compressed" --argjson size "$(cat size.txt)" \
            --slurpfile verify verify.json \
            '{image: $image, digest: $digest, linux_amd64_manifest_digest: $platform, tag: $tag,
              source_revision: $revision, workflow_run: $run, compressed_bytes: $compressed,
              uncompressed_bytes: $size, verify: $verify[0]}' > out/image.json
          cat out/image.json
          {
            echo "## AMT image published"
            echo
            echo "Pin this in \`spikes/s6-ai-arranging/amt/manifest.json\` (\`workload.image\`):"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Index digest (with SBOM + provenance) | \`$DIGEST\` |"
            echo "| linux/amd64 manifest digest | \`$platform\` |"
            echo "| Tags | \`$TAG\`, \`sha-$GITHUB_SHA\` |"
            echo "| Source revision | \`$GITHUB_SHA\` |"
            echo "| Size | $((compressed / 1048576)) MiB compressed, $(( $(cat size.txt) / 1048576 )) MiB unpacked |"
            echo "| Model SHA-256 (verified in the pulled image) | \`$(jq -r .model_sha256 verify.json)\` |"
            echo "| torch / CUDA | $(jq -r '.torch + " / " + .torch_cuda' verify.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amt-image-digest
          path: out/
          if-no-files-found: error
