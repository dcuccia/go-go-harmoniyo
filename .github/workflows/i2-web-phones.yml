name: i2-web-phones

# The alpha path (docs/plan/v0.1-alpha.md, A7): the I2 game in spikes/i2-web-phones and the S1/S4/S5/shared
# code it imports. Ports used by the e2e scripts are non-default (18080+, 18500, 18600, 18700).
on:
  pull_request:
    paths:
      - 'spikes/i2-web-phones/**'
      - 'spikes/s1-phone-bell/**'
      - 'spikes/s4-web-host/**'
      - 'spikes/s5-chart-pipeline/**'
      - 'spikes/shared/**'
      - 'docs/design/pitch-class-palette.json'
      - '.github/workflows/i2-web-phones.yml'
  push:
    branches: [main]
    paths:
      - 'spikes/i2-web-phones/**'
      - 'spikes/s1-phone-bell/**'
      - 'spikes/s4-web-host/**'
      - 'spikes/s5-chart-pipeline/**'
      - 'spikes/shared/**'
      - 'docs/design/pitch-class-palette.json'
      - '.github/workflows/i2-web-phones.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i2-web-phones-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: typecheck, unit tests, build, seating e2e
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: spikes/i2-web-phones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spikes/i2-web-phones/package-lock.json
            spikes/s1-phone-bell/package-lock.json
            spikes/s4-web-host/package-lock.json
      - name: npm ci (I2, plus S1 for the host and S4 for its tests)
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix ../s1-phone-bell
          npm ci --no-audit --no-fund --prefix ../s4-web-host
      - run: npm run typecheck
      # Build first: its prebuild generates public/charts/ (gitignored), which the chart, seating and
      # backing tests need (they skip themselves without it).
      - run: npm run build
      - run: npm test
      - name: S4 unit tests
        working-directory: spikes/s4-web-host
        run: npm test
      - name: S5 unit tests
        working-directory: spikes/s5-chart-pipeline
        run: npm test
      # Headless Chrome (preinstalled on ubuntu-latest). --ignore-scripts skips the pre-script's second build.
      - name: Seating e2e (real S1 host, 2 emulated phone pages + 1 simulated phone)
        run: npm run e2e:seating --ignore-scripts
      - name: Drop-in + practice speed e2e (join mid-song → seated next round; corner QR; speed control)
        run: npm run e2e:dropin --ignore-scripts
      - name: Reconnect/takeover e2e (two tabs of one phone: no ping-pong; Use this tab; QR re-scan mid-song)
        run: npm run e2e:takeover --ignore-scripts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2-seating-e2e
          path: |
            spikes/i2-web-phones/results/seating-e2e.json
            spikes/i2-web-phones/results/dropin-e2e.json
            spikes/i2-web-phones/results/takeover-e2e.json
          if-no-files-found: ignore

  # Gating since #18: misses wait for in-flight rings (source-timestamp judging survives slow frames
  # and Wi-Fi-like delays) and the simulated phones' draws are seeded per part. On failure the e2e
  # prints timing evidence (clock mappings, ring latency, strays) and the JSON is uploaded.
  timing-e2e:
    name: timing e2e
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: spikes/i2-web-phones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spikes/i2-web-phones/package-lock.json
            spikes/s1-phone-bell/package-lock.json
      - run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix ../s1-phone-bell
      - run: npm run build
      - name: Timing e2e (5 scenarios, one at 50 % practice speed)
        run: npm run e2e --ignore-scripts
      - if: always()
        run: cat results/e2e-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2-timing-e2e
          path: spikes/i2-web-phones/results/e2e-*.json
          if-no-files-found: ignore

  # Early Safari-engine signal for the phone controller (#27). Informational: not a substitute for a real
  # iPhone, and Playwright's WebKit is not iOS Safari. See results/webkit-controller-check.md.
  webkit-smoke:
    name: WebKit controller smoke (iPhone emulation, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/i2-web-phones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spikes/i2-web-phones/package-lock.json
            spikes/s1-phone-bell/package-lock.json
      - run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix ../s1-phone-bell
      - name: Install Playwright WebKit (browser + system libraries; version pinned by playwright-core)
        run: npx playwright-core install --with-deps webkit
      - run: npm run build
      - name: WebKit controller check
        id: webkit
        continue-on-error: true
        run: node scripts/webkit-controller-check.mjs
      - if: steps.webkit.outcome == 'failure'
        run: >-
          echo "::warning title=WebKit controller check failed (informational)::See the job summary and results/webkit-controller-check.md; file holiday issues under #34"
      - if: always()
        run: cat results/webkit-controller-check.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i2-webkit-controller-check
          path: |
            spikes/i2-web-phones/results/webkit-controller-check.json
            spikes/i2-web-phones/results/webkit-controller-check.md
          if-no-files-found: ignore
