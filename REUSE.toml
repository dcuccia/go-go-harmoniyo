# REUSE (https://reuse.software) licensing map for handbell-hero. See ADR-0008 and
# attribution/register.json. Order matters: when several annotations match a file, the LAST one
# wins. Keep this file in sync with the asset register (`node tools/licensing/attribution.mjs`
# checks that every register entry's license matches the REUSE annotation for its files).
version = 1
SPDX-PackageName = "handbell-hero"
SPDX-PackageSupplier = "David Cuccia <https://github.com/dcuccia>"
SPDX-PackageDownloadLocation = "https://github.com/dcuccia/handbell-hero"

# Default: code, docs, configs, test data and generated reports are MIT.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 David Cuccia and handbell-hero contributors"
SPDX-License-Identifier = "MIT"

# Original media (screenshots/captures of the project's own UI): CC BY 4.0.
[[annotations]]
path = [
  "docs/spikes/media/**",
  "docs/spikes/I1-data/**.png",
  "docs/design/media/**",
  "spikes/s1-phone-bell/results/**.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 David Cuccia and handbell-hero contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# AI-generated assets: CC0 1.0 (S5 self-encoded public-domain carol lead sheets, test fixture).
[[annotations]]
path = [
  "spikes/s5-chart-pipeline/songs/*.abc",
  "spikes/s5-chart-pipeline/test/fixtures/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 handbell-hero contributors (AI-assisted; dedicated to the public domain)"
SPDX-License-Identifier = "CC0-1.0"

# Charts and exports generated by the S5 pipeline from the CC0 lead sheets: CC0 1.0.
[[annotations]]
path = [
  "spikes/s5-chart-pipeline/charts/deck-the-halls.json",
  "spikes/s5-chart-pipeline/charts/jingle-bells.json",
  "spikes/s5-chart-pipeline/charts/joy-to-the-world.json",
  "spikes/s5-chart-pipeline/charts/silent-night.json",
  "spikes/s5-chart-pipeline/charts/we-wish-you-a-merry-christmas.json",
  "spikes/s5-chart-pipeline/exports/deck-the-halls/**",
  "spikes/s5-chart-pipeline/exports/jingle-bells/**",
  "spikes/s5-chart-pipeline/exports/joy-to-the-world/**",
  "spikes/s5-chart-pipeline/exports/silent-night/**",
  "spikes/s5-chart-pipeline/exports/we-wish-you-a-merry-christmas/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 handbell-hero contributors (generated; dedicated to the public domain)"
SPDX-License-Identifier = "CC0-1.0"

# Mutopia Project files (unmodified) and the charts/exports generated from them: public domain.
[[annotations]]
path = [
  "spikes/s5-chart-pipeline/sources/mutopia/carol.*",
  "spikes/s5-chart-pipeline/charts/it-came-upon-the-midnight-clear.json",
  "spikes/s5-chart-pipeline/exports/it-came-upon-the-midnight-clear/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Typeset by Steve Dunlop for the Mutopia Project (Mutopia-2008/01/13-1231), placed in the public domain"
SPDX-License-Identifier = "LicenseRef-Mutopia-PublicDomain"

[[annotations]]
path = [
  "spikes/s5-chart-pipeline/sources/mutopia/GoodKingWenceslas.*",
  "spikes/s5-chart-pipeline/charts/good-king-wenceslas.json",
  "spikes/s5-chart-pipeline/exports/good-king-wenceslas/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Typeset by James Kilfiger for the Mutopia Project (Mutopia-2007/01/10-905), placed in the public domain"
SPDX-License-Identifier = "LicenseRef-Mutopia-PublicDomain"

[[annotations]]
path = [
  "spikes/s5-chart-pipeline/sources/mutopia/thehollyandtheivy.*",
  "spikes/s5-chart-pipeline/charts/the-holly-and-the-ivy.json",
  "spikes/s5-chart-pipeline/exports/the-holly-and-the-ivy/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Typeset by Geoffrey Lehr for the Mutopia Project (Mutopia-2005/12/23-644), placed in the public domain"
SPDX-License-Identifier = "LicenseRef-Mutopia-PublicDomain"

# ADR-0008 exception EX-005: a patch against YARG.Core (LGPL-3.0-or-later). Not MIT.
[[annotations]]
path = "spikes/s2-yarg-core/patches/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "YARC-Official and the YARG.Core contributors",
  "2026 David Cuccia and handbell-hero contributors (patch)",
]
SPDX-License-Identifier = "LGPL-3.0-or-later"
