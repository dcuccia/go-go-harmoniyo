# Go Go HarmoniYo S9: signalling Worker + static web build, on the Cloudflare Workers free plan.
# See docs/spikes/S9-report.md for the credential-free dry run and explicit owner deployment.
name = "go-go-harmoniyo"
main = "worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalRoom"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
